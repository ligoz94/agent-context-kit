#     orchestrator:
#       provider: openai
#       model: gpt-5.4
#       effort: high
#     worker:
#       provider: anthropic
#       model: claude-sonnet
#       effort: medium
#     validator:
#       provider: openai
#       model: gpt-5.4-mini
#       effort: medium
#   validation_contract:
#     required: true
#     assertions:
#       - id: vc-001
#         title: starting-a-mission-persists-state
#         type: scrutiny
#         description: Starting a mission creates a persistent state file.
#   handoff:
#     required: true
#     schema_version: 1.0
#     example:
#       runId: wrk-001
#       role: worker
#       status: completed
#       summary: Implemented the assigned slice.
#       filesTouched:
#         - packages/missions/src/state.ts
#       commands:
#         - command: npm test -- missions
#           exitCode: 0
#       issues: []
#       nextSuggestedAction: Run scrutiny validator.
